<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>AI 塔罗高转化测试版</title>
  <style>
    :root{--bg:#0f1020;--panel:#191b31;--panel2:#232642;--text:#f6f2ff;--muted:#aaa7bd;--accent:#8f7cff;--accent2:#b8adff;--gold:#e9c86f;--border:rgba(255,255,255,.1);--good:#6ed1a9}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,rgba(143,124,255,.22),transparent 32%),radial-gradient(circle at 100% 20%,rgba(233,200,111,.1),transparent 25%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 15px 44px}.stack{display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:10px;flex-wrap:wrap}.center{text-align:center}.muted{color:var(--muted)}.panel{border:1px solid var(--border);border-radius:20px;padding:16px;background:rgba(25,27,49,.94)}.soft{background:rgba(143,124,255,.08)}.hero{padding:42px 8px 18px}.moon{font-size:56px}h1{font-size:30px;margin:12px 0 8px}h2{font-size:22px;margin:0}h3{font-size:17px;margin:0}p{line-height:1.65;margin:6px 0}textarea{width:100%;border:1px solid var(--border);border-radius:16px;padding:14px;background:#111329;color:var(--text);font:inherit;resize:vertical;min-height:110px;outline:none}button{font:inherit;cursor:pointer}.primary{width:100%;border:0;border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-weight:700}.secondary{width:100%;border:1px solid var(--border);border-radius:16px;padding:13px 16px;background:transparent;color:var(--text)}.chip{border:1px solid var(--border);border-radius:999px;padding:9px 13px;background:transparent;color:var(--text)}.chip.active{background:rgba(143,124,255,.16);border-color:var(--accent)}.callout{border-left:3px solid var(--accent);padding:13px 14px;background:rgba(143,124,255,.08);border-radius:14px;line-height:1.65}.chat{display:flex;flex-direction:column;gap:12px}.msg{display:flex;gap:9px;align-items:flex-start}.msg.user{justify-content:flex-end}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);flex:0 0 auto}.bubble{max-width:84%;border:1px solid var(--border);border-radius:16px;padding:12px 14px;background:var(--panel);line-height:1.65;white-space:pre-wrap}.user .bubble{background:var(--accent);border-color:transparent;color:white}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tarot-card{border:1px solid rgba(233,200,111,.4);border-radius:16px;padding:15px 6px;text-align:center;background:#12142b}.tarot-icon{font-size:34px;display:block;margin-bottom:8px}.tarot-name{font-weight:700;color:var(--gold);font-size:14px}.tarot-pos{font-size:12px;color:var(--muted);margin-top:4px}.metric{display:flex;justify-content:space-between;gap:12px}.progress{height:10px;border-radius:999px;background:#101225;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent)}.checklist{display:flex;flex-direction:column;gap:9px}.check{display:flex;gap:8px;align-items:flex-start}.locked{opacity:.55}.preview{border-left:3px solid var(--gold);padding-left:12px}.price{font-size:34px;font-weight:800}.tiny{font-size:12px;color:var(--muted)}.badge{display:inline-block;border-radius:999px;padding:6px 10px;background:rgba(110,209,169,.12);color:var(--good);font-size:12px}.share-card{border:1px solid var(--border);border-radius:22px;padding:18px;text-align:center;background:var(--panel)}.loading{display:inline-flex;gap:5px;justify-content:center}.loading span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite alternate}.loading span:nth-child(2){animation-delay:.2s}.loading span:nth-child(3){animation-delay:.4s}@keyframes pulse{to{opacity:.25;transform:translateY(-4px)}}
  </style>
</head>
<body>
<div class="app"><div id="app"></div></div>
<script>
const app=document.getElementById('app');
let state={topic:'事业方向',question:'',fear:'',attempt:'',goal:'行动方案',cards:[],followups:3};
const deck=[
{name:'愚者',icon:'🧳',keyword:'开始',meaning:'你正在接近一个新阶段。适合小步尝试，而不是等待所有条件完美。'},
{name:'魔术师',icon:'🪄',keyword:'能力',meaning:'你已有部分资源，关键是主动组合并真正投入使用。'},
{name:'女祭司',icon:'🌙',keyword:'观察',meaning:'信息尚未完全显现，先理解自己的真实动机。'},
{name:'皇帝',icon:'👑',keyword:'结构',meaning:'你需要建立规则、边界、预算和执行节奏。'},
{name:'恋人',icon:'💞',keyword:'选择',meaning:'这不是单纯的收益比较，而是价值观选择。'},
{name:'战车',icon:'🏇',keyword:'聚焦',meaning:'减少分散，把资源集中到一个最关键目标。'},
{name:'力量',icon:'🦁',keyword:'稳定',meaning:'长期稳定比短期爆发更重要。'},
{name:'隐者',icon:'🏮',keyword:'反思',meaning:'减少外界噪音，回到自己的经验和判断。'},
{name:'命运之轮',icon:'🎡',keyword:'变化',meaning:'环境在变化，保持弹性比固守旧计划更重要。'},
{name:'正义',icon:'⚖️',keyword:'事实',meaning:'回到数据、责任和长期后果，而不是只凭感觉。'},
{name:'死神',icon:'🦋',keyword:'转化',meaning:'某个旧阶段需要结束，新方向才能真正开始。'},
{name:'节制',icon:'🏺',keyword:'平衡',meaning:'不要走极端，寻找不同资源之间的稳定组合。'},
{name:'高塔',icon:'⚡',keyword:'重构',meaning:'某些旧假设已不成立，需要及时重建。'},
{name:'星星',icon:'⭐',keyword:'希望',meaning:'方向值得继续探索，但希望要建立在持续行动上。'},
{name:'月亮',icon:'🌘',keyword:'不确定',meaning:'当前存在焦虑和模糊，注意不要把想象当成事实。'},
{name:'太阳',icon:'☀️',keyword:'清晰',meaning:'公开沟通和展示成果，会带来更清晰反馈。'},
{name:'世界',icon:'🌍',keyword:'完成',meaning:'一个阶段接近闭环，适合总结并进入下一轮。'}];
function show(html){app.innerHTML=html;window.scrollTo({top:0,behavior:'smooth'})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function addMessage(container,text,role='assistant'){const row=document.createElement('div');row.className='msg '+(role==='user'?'user':'');if(role!=='user'){const a=document.createElement('div');a.className='avatar';a.textContent='🌙';row.appendChild(a)}const b=document.createElement('div');b.className='bubble';b.textContent=text;row.appendChild(b);container.appendChild(row)}
function home(){show(`<section class="stack"><div class="hero center"><div class="moon">🌙</div><h1>AI 塔罗决策助手</h1><p class="muted">不是预测未来，而是帮你看清问题与下一步</p></div><div class="panel stack"><label for="question"><b>最近哪件事让你反复思考？</b></label><textarea id="question" placeholder="例如：我想做轻量产品，但担心投入后没有用户付费。"></textarea><div class="row">${['事业方向','感情关系','个人成长','近期选择'].map(t=>`<button class="chip topic ${t===state.topic?'active':''}" data-topic="${t}">${t}</button>`).join('')}</div><button id="start" class="primary">开始免费分析</button></div><div class="callout">免费获得三张牌、个性化核心判断和一个立即可执行的建议。完整行动报告为一次性购买，不自动续费。</div></section>`);document.querySelectorAll('.topic').forEach(btn=>btn.addEventListener('click',()=>{state.topic=btn.dataset.topic;document.querySelectorAll('.topic').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}));document.getElementById('start').addEventListener('click',()=>{state.question=document.getElementById('question').value.trim()||'我最近对下一步有些迷茫。';stepFear()})}
function stepFear(){show(`<section class="stack"><div><h2>正在理解你的问题</h2><p class="muted">1 / 3</p></div><div id="chat" class="chat"></div><div id="choices" class="row"></div></section>`);const chat=document.getElementById('chat'),choices=document.getElementById('choices');addMessage(chat,state.question,'user');setTimeout(()=>{addMessage(chat,'你最担心出现什么结果？');choices.innerHTML=['结果失败','损失时间或金钱','别人不支持','不知道怎么开始'].map(x=>`<button class="chip opt" data-value="${x}">${x}</button>`).join('');document.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>{state.fear=btn.dataset.value;stepAttempt()}))},350)}
function stepAttempt(){show(`<section class="stack"><div><h2>正在理解你的问题</h2><p class="muted">2 / 3</p></div><div class="panel stack"><p><b>你已经尝试过什么？</b></p><textarea id="attempt" placeholder="例如：做过页面、问过朋友，但还没有真实收费测试。"></textarea><button id="next" class="primary">继续</button></div></section>`);document.getElementById('next').addEventListener('click',()=>{state.attempt=document.getElementById('attempt').value.trim()||'目前主要停留在思考，还没有做真实验证。';stepGoal()})}
function stepGoal(){show(`<section class="stack"><div><h2>你最希望获得什么？</h2><p class="muted">3 / 3</p></div><div class="row">${['方向判断','风险提醒','行动方案'].map(x=>`<button class="chip goal" data-value="${x}">${x}</button>`).join('')}</div></section>`);document.querySelectorAll('.goal').forEach(btn=>btn.addEventListener('click',()=>{state.goal=btn.dataset.value;drawLoading()}))}
function drawLoading(){show(`<section class="stack center" style="padding-top:80px"><div class="moon">🃏</div><h2>正在生成你的专属分析</h2><p class="muted">结合你的问题、担忧、尝试和本次牌面</p><div class="loading"><span></span><span></span><span></span></div></section>`);setTimeout(()=>{state.cards=[...deck].sort(()=>Math.random()-.5).slice(0,3);result()},900)}
function result(){const c=state.cards;show(`<section class="stack"><div class="center"><h2>你的三张牌</h2><p class="muted">报告编号 LUNA-${Math.floor(1000+Math.random()*9000)}</p></div><div class="cards">${c.map((x,i)=>`<div class="tarot-card"><span class="tarot-icon">${x.icon}</span><div class="tarot-name">${x.name}</div><div class="tarot-pos">${['现状','阻碍','建议'][i]}</div></div>`).join('')}</div><div class="panel stack"><b>AI首先听到了你的原话</b><div class="preview">“${esc(state.question)}”</div><p class="muted">你最担心的是“${esc(state.fear)}”，而你已经尝试过“${esc(state.attempt)}”。这说明你需要的不是更多抽象鼓励，而是${esc(state.goal)}。</p></div><div class="callout"><b>免费核心判断</b><p>你当前最大的困难，不一定是缺少能力，而是没有把不确定问题转化成一个可以快速验证的小实验。</p></div><div class="panel stack"><div><b>现状 · ${c[0].name}</b><p class="muted">${c[0].meaning}</p></div><div><b>今天可以做的一步</b><p class="muted">把当前问题缩小成一个7天内能验证的目标，并明确“什么结果意味着继续”。</p></div></div><div class="panel stack"><div class="metric"><b>你的分析完成度</b><b>67%</b></div><div class="progress"><span style="width:67%"></span></div><div class="checklist"><div class="check">✓ <span>已理解你的真实问题</span></div><div class="check">✓ <span>已识别最担心的结果</span></div><div class="check">✓ <span>已完成现状牌分析</span></div><div class="check locked">○ <span>核心阻碍与失效假设</span></div><div class="check locked">○ <span>三张牌综合关系</span></div><div class="check locked">○ <span>未来7天行动方案</span></div></div></div><div class="panel soft stack"><h3>完整报告将回答</h3><div class="preview"><b>核心阻碍预览</b><p class="muted">你可能正在用“继续准备”替代“面对真实反馈”……</p></div><div class="checklist"><div class="check">1. <span>为什么“${c[1].name}”出现在阻碍位置？</span></div><div class="check">2. <span>你可能坚持了哪个已经失效的假设？</span></div><div class="check">3. <span>“${c[2].name}”建议建立什么行动结构？</span></div><div class="check">4. <span>未来7天执行哪三个动作？</span></div><div class="check">5. <span>如何通过3次AI追问继续拆解？</span></div></div><div class="metric"><div><div class="price">¥9.9</div><div class="tiny">一次性购买 · 不是自动续费</div></div><span class="badge">完整行动报告</span></div><button id="unlock" class="primary">查看我的完整分析</button><button id="keep" class="secondary">先保留免费结果</button><div class="tiny center">当前为测试页面，不会产生真实扣款。</div></div></section>`);document.getElementById('unlock').addEventListener('click',checkout);document.getElementById('keep').addEventListener('click',saved)}
function saved(){show(`<section class="stack center" style="padding-top:80px"><div class="moon">✓</div><h2>免费结果已保留</h2><p class="muted">你可以重新体验，或返回查看完整报告权益。</p><button id="back" class="primary">返回报告</button><button id="restart" class="secondary">重新体验</button></section>`);document.getElementById('back').addEventListener('click',result);document.getElementById('restart').addEventListener('click',home)}
function checkout(){show(`<section class="stack"><div class="center" style="padding-top:30px"><div class="moon">💳</div><h2>确认解锁完整行动报告</h2></div><div class="panel stack"><div class="metric"><span>完整AI问题分析</span><b>¥9.90</b></div><div class="checklist"><div class="check">✓ <span>三张牌完整综合分析</span></div><div class="check">✓ <span>核心矛盾与风险盲点</span></div><div class="check">✓ <span>7天具体行动方案</span></div><div class="check">✓ <span>3次AI继续追问</span></div><div class="check">✓ <span>永久保存与分享卡</span></div></div><div class="metric"><span class="muted">支付方式</span><span>微信支付</span></div><div class="tiny">一次性购买，不自动续费。支付成功后立即生成报告。</div></div><button id="pay" class="primary">模拟微信支付 ¥9.90</button><button id="cancel" class="secondary">返回免费结果</button></section>`);document.getElementById('pay').addEventListener('click',fullReport);document.getElementById('cancel').addEventListener('click',result)}
function fullReport(){const c=state.cards;show(`<section class="stack"><div><span class="badge">支付成功 · 已保存</span><h2 style="margin-top:10px">你的完整行动报告</h2><p class="muted">${esc(state.question)}</p></div><div class="callout"><b>一句话结论</b><p>你可以继续探索这个方向，但第一步不应是重投入，而应是低成本验证。</p></div><div class="panel stack"><div><b>现状 · ${c[0].name}</b><p class="muted">${c[0].meaning}</p></div><div><b>阻碍 · ${c[1].name}</b><p class="muted">${c[1].meaning} 你可能正在用继续准备，替代面对真实反馈。</p></div><div><b>建议 · ${c[2].name}</b><p class="muted">${c[2].meaning} 把抽象方向转成明确时间、预算和验证指标。</p></div></div><div class="panel stack"><b>未来7天行动方案</b><div>今天：写下唯一需要验证的关键假设。</div><div>3天内：找到5名真实目标用户沟通。</div><div>7天内：做出一个可以展示或收费的最小版本。</div></div><div class="panel stack"><div class="metric"><b>继续追问AI</b><span>${state.followups}次可用</span></div><div class="row"><button class="chip ask">我最应该先做什么？</button><button class="chip ask">最大的风险是什么？</button><button class="chip ask">如何降低试错成本？</button></div></div><button id="share" class="primary">生成我的分享卡</button></section>`);document.querySelectorAll('.ask').forEach(btn=>btn.addEventListener('click',()=>followup(btn.textContent)));document.getElementById('share').addEventListener('click',share)}
function followup(q){if(state.followups>0)state.followups--;show(`<section class="stack"><h2>AI继续追问</h2><div id="chat" class="chat"></div><button id="back" class="secondary">返回报告（剩余${state.followups}次）</button></section>`);const chat=document.getElementById('chat');addMessage(chat,q,'user');setTimeout(()=>addMessage(chat,'结合你的问题和牌面，最值得优先做的不是扩大投入，而是验证一个最关键假设。把行动控制在7天、可衡量、可停止的范围内。'),350);document.getElementById('back').addEventListener('click',fullReport)}
function share(){const c=state.cards,score=76+Math.floor(Math.random()*17);show(`<section class="stack"><div class="share-card stack"><div class="muted">我的 AI 塔罗行动报告</div><div style="font-size:42px">${c.map(x=>x.icon).join(' ')}</div><h2>${c[2].keyword}型行动者</h2><p>${c.map(x=>x.keyword).join(' · ')}</p><div class="panel stack" style="text-align:left"><div class="metric"><span>行动清晰度</span><b>${score}%</b></div><div class="progress"><span style="width:${score}%"></span></div></div><div class="callout" style="text-align:left"><b>我的一句话建议</b><p>停止等待完美答案，用一次小行动换取真实反馈。</p></div><div class="panel">好友体验码：LUNA-${Math.floor(1000+Math.random()*9000)}</div><div class="tiny">好友完成体验后，双方各增加1次AI追问。</div></div><button id="shareBtn" class="primary">模拟分享给好友</button><button id="back" class="secondary">返回报告</button></section>`);document.getElementById('shareBtn').addEventListener('click',()=>document.getElementById('shareBtn').textContent='分享成功：好友可进入同款体验');document.getElementById('back').addEventListener('click',fullReport)}
home();
</script>
</body>
</html>
