<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI塔罗互动测试</title><style>:root{--b:#0f1020;--p:#1a1c33;--t:#f6f2ff;--m:#aaa6bc;--a:#8f7cff;--g:#e8c773;--bd:rgba(255,255,255,.11)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,rgba(143,124,255,.24),transparent 35%),var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.app{max-width:540px;margin:auto;min-height:100vh;padding:22px 15px 48px}.stack{display:flex;flex-direction:column;gap:14px}.panel{background:var(--p);border:1px solid var(--bd);border-radius:20px;padding:16px}.center{text-align:center}.muted{color:var(--m)}h1{font-size:29px;margin:10px 0}h2{font-size:22px;margin:0}p{line-height:1.65}textarea{width:100%;min-height:110px;border:1px solid var(--bd);border-radius:16px;background:#111329;color:var(--t);padding:14px;font:inherit}.row{display:flex;gap:9px;flex-wrap:wrap}button{font:inherit;cursor:pointer}.primary{width:100%;border:0;border-radius:15px;padding:14px;background:linear-gradient(135deg,var(--a),#b7aaff);color:#fff;font-weight:700}.secondary{width:100%;border:1px solid var(--bd);border-radius:15px;padding:13px;background:transparent;color:var(--t)}.chip{border:1px solid var(--bd);border-radius:999px;padding:9px 13px;background:transparent;color:var(--t)}.chip.active{background:rgba(143,124,255,.18);border-color:var(--a)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.back{aspect-ratio:2/3;border:1px solid rgba(232,199,115,.5);border-radius:13px;background:radial-gradient(circle,transparent 0 18%,rgba(232,199,115,.2) 19% 21%,transparent 22%),linear-gradient(145deg,#292b50,#111329)}.back.sel{outline:3px solid var(--a);transform:translateY(-4px)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{border:1px solid rgba(232,199,115,.45);border-radius:15px;padding:15px 6px;text-align:center;background:#12142a}.icon{font-size:34px}.name{color:var(--g);font-weight:700}.small{font-size:12px;color:var(--m)}.bar{height:10px;border-radius:999px;background:#111329;overflow:hidden}.bar span{display:block;width:67%;height:100%;background:var(--a)}.call{border-left:3px solid var(--a);background:rgba(143,124,255,.08);padding:13px;border-radius:13px}.price{font-size:34px;font-weight:800}</style></head><body><div class="app"><div id="app"></div></div><script>document.addEventListener('DOMContentLoaded',()=>{const root=document.getElementById('app');let s={topic:'事业方向',q:'',fear:'',try:'',goal:'行动方案',pick:[],cards:[]};const deck=[['愚者','🧳','开始','适合小步尝试，不要等待所有条件完美。'],['魔术师','🪄','能力','你已有资源，关键是组合并投入使用。'],['女祭司','🌙','观察','先理解隐藏信息与真实动机。'],['皇帝','👑','结构','建立规则、边界、预算和节奏。'],['恋人','💞','选择','关键是价值一致，而非只看短期收益。'],['战车','🏇','聚焦','减少分散，集中突破关键目标。'],['力量','🦁','稳定','长期稳定比短期爆发更重要。'],['隐者','🏮','反思','减少噪音，回到自己的经验。'],['命运之轮','🎡','变化','保持弹性，及时调整旧计划。'],['正义','⚖️','事实','回到证据、责任和长期后果。'],['死神','🦋','转化','旧阶段需要结束，新阶段才能开始。'],['节制','🏺','平衡','整合资源，避免走极端。'],['高塔','⚡','重构','旧假设可能失效，需要重建。'],['星星','⭐','希望','方向值得探索，但要靠行动支撑。'],['月亮','🌘','不确定','注意别把焦虑和想象当成事实。'],['太阳','☀️','清晰','真诚沟通会带来清晰反馈。'],['世界','🌍','完成','一个阶段接近闭环。']];const show=h=>{root.innerHTML=h;scrollTo({top:0,behavior:'smooth'})};const esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function home(){show(`<div class="stack"><div class="center" style="padding-top:35px"><div style="font-size:58px">🌙</div><h1>AI 塔罗决策助手</h1><p class="muted">通过对话、选牌和行动建议重新理解问题</p></div><div class="panel stack"><b>最近哪件事让你反复思考？</b><textarea id="q" placeholder="例如：我想做轻量产品，但担心没有用户付费。"></textarea><div class="row">${['事业方向','感情关系','个人成长','近期选择'].map(x=>`<button class="chip topic ${x===s.topic?'active':''}" data-v="${x}">${x}</button>`).join('')}</div><button id="start" class="primary">开始免费分析</button></div><div class="call">免费获得三张牌、个性化判断和一个立即可执行的建议。</div></div>`);document.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{s.topic=b.dataset.v;document.querySelectorAll('.topic').forEach(x=>x.classList.remove('active'));b.classList.add('active')});start.onclick=()=>{s.q=q.value.trim()||'我最近对下一步有些迷茫。';fear()}}function fear(){show(`<div class="stack"><h2>第1步：你最担心什么？</h2><div class="panel">“${esc(s.q)}”</div><div class="row">${['结果失败','损失时间或金钱','别人不支持','不知道怎么开始'].map(x=>`<button class="chip f" data-v="${x}">${x}</button>`).join('')}</div></div>`);document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{s.fear=b.dataset.v;attempt()})}function attempt(){show(`<div class="stack"><h2>第2步：你已经尝试过什么？</h2><div class="panel stack"><textarea id="a" placeholder="例如：问过朋友、做过页面，但没有真实收费测试。"></textarea><button id="next" class="primary">继续</button></div></div>`);next.onclick=()=>{s.try=a.value.trim()||'还没有做真实验证。';goal()}}function goal(){show(`<div class="stack"><h2>第3步：你最希望获得什么？</h2><div class="row">${['方向判断','风险提醒','行动方案'].map(x=>`<button class="chip g" data-v="${x}">${x}</button>`).join('')}</div></div>`);document.querySelectorAll('.g').forEach(b=>b.onclick=()=>{s.goal=b.dataset.v;choose()})}function choose(){s.pick=[];show(`<div class="stack"><div class="center"><h2>请亲手选择三张牌</h2><p class="muted">已选择 <b id="count">0</b>/3</p></div><div class="grid">${Array.from({length:12},(_,i)=>`<button class="back" data-i="${i}"></button>`).join('')}</div><button id="open" class="primary" disabled>翻开三张牌</button></div>`);document.querySelectorAll('.back').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(s.pick.includes(i)){s.pick=s.pick.filter(x=>x!==i);b.classList.remove('sel')}else if(s.pick.length<3){s.pick.push(i);b.classList.add('sel')}count.textContent=s.pick.length;open.disabled=s.pick.length!==3});open.onclick=()=>{s.cards=[...deck].sort(()=>Math.random()-.5).slice(0,3);result()}}function result(){let c=s.cards;show(`<div class="stack"><div class="center"><h2>你的三张牌</h2></div><div class="cards">${c.map((x,i)=>`<div class="card"><div class="icon">${x[1]}</div><div class="name">${x[0]}</div><div class="small">${['现状','阻碍','建议'][i]}</div></div>`).join('')}</div><div class="panel stack"><b>AI听到了你的原话</b><div>“${esc(s.q)}”</div><p class="muted">你担心“${esc(s.fear)}”，已经尝试过“${esc(s.try)}”，希望获得${esc(s.goal)}。</p></div><div class="call"><b>免费核心判断</b><p>你当前最大的困难，可能不是缺少能力，而是没有把不确定问题转成一个可验证的小实验。</p></div><div class="panel"><b>现状 · ${c[0][0]}</b><p class="muted">${c[0][3]}</p></div><div class="panel stack"><div style="display:flex;justify-content:space-between"><b>分析完成度</b><b>67%</b></div><div class="bar"><span></span></div><div>✓ 已理解真实问题</div><div>✓ 已完成现状分析</div><div class="muted">○ 核心阻碍与失效假设</div><div class="muted">○ 三张牌综合关系</div><div class="muted">○ 未来7天行动计划</div></div><div class="panel stack"><h2>完整行动报告</h2><p>将回答“${c[1][0]}”为何是阻碍、“${c[2][0]}”建议什么行动，并生成7天计划和3次追问。</p><div class="price">¥9.9</div><div class="small">一次性购买 · 非自动续费 · 测试页不扣款</div><button id="pay" class="primary">查看我的完整分析</button><button id="again" class="secondary">重新体验</button></div></div>`);pay.onclick=checkout;again.onclick=home}function checkout(){show(`<div class="stack"><div class="center" style="padding-top:50px"><div style="font-size:55px">💳</div><h2>确认解锁</h2></div><div class="panel stack"><div style="display:flex;justify-content:space-between"><span>完整行动报告</span><b>¥9.90</b></div><div>✓ 三牌综合分析</div><div>✓ 风险盲点</div><div>✓ 7天行动方案</div><div>✓ 3次继续追问</div><div class="small">一次性购买，不自动续费；当前不会真实扣款。</div></div><button id="done" class="primary">模拟微信支付 ¥9.90</button><button id="back" class="secondary">返回</button></div>`);done.onclick=report;back.onclick=result}function report(){let c=s.cards;show(`<div class="stack"><div><span style="color:var(--g)">✓ 支付成功</span><h2>你的完整行动报告</h2></div><div class="call"><b>一句话结论</b><p>可以继续探索，但第一步不应重投入，而应低成本验证。</p></div>${c.map((x,i)=>`<div class="panel"><b>${['现状','阻碍','建议'][i]} · ${x[0]}</b><p class="muted">${x[3]}</p></div>`).join('')}<div class="panel stack"><b>未来7天</b><div>今天：写下唯一要验证的假设。</div><div>3天内：找5名真实用户沟通。</div><div>7天内：做出可以收费的最小版本。</div></div><button id="share" class="primary">生成分享卡</button><button id="restart" class="secondary">重新体验</button></div>`);share.onclick=card;restart.onclick=home}function card(){let c=s.cards;show(`<div class="stack"><div class="panel center stack"><div class="muted">我的 AI 塔罗行动报告</div><div style="font-size:42px">${c.map(x=>x[1]).join(' ')}</div><h2>${c[2][2]}型行动者</h2><p>${c.map(x=>x[2]).join(' · ')}</p><div class="call" style="text-align:left">停止等待完美答案，用一次小行动换取真实反馈。</div><div>好友体验码：LUNA-${Math.floor(1000+Math.random()*9000)}</div></div><button id="copy" class="primary">模拟分享</button><button id="r" class="secondary">返回报告</button></div>`);copy.onclick=()=>copy.textContent='分享成功';r.onclick=report}home()});</script></body></html>
